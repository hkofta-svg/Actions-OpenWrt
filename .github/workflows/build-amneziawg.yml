name: Build OpenWrt 25.12.0 for IPQ60xx

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: '是否開啟 SSH 偵錯 (true/false)'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com
  REPO_BRANCH: v25.12.0
  CONFIG_FILE: ipq60xx.config
  TZ: Asia/Taipei

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: 簽出本地代碼
      uses: actions/checkout@v4

    - name: 初始化編譯環境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
        sudo timedatectl set-timezone "${{ env.TZ }}"
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir

    - name: 複製 OpenWrt 原始碼
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 注入 AmneziaWG 3.1 擴充套件
      run: |
        cd openwrt
        # 使用社群維護的、支持 AWG 3.1 的分支
        git clone https://github.com package/amneziawg
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 修改並鎖定內核為 Linux 6.18.38
      run: |
        cd openwrt
        # 1. 修改 qualcommax 目標平台的默認內核大版本為 6.18
        sed -i 's/KERNEL_PATCHVER:=.*/KERNEL_PATCHVER:=6.18/g' target/linux/qualcommax/Makefile
        
        # 2. 修改內核全局特定小版本號
        sed -i 's/LINUX_VERSION-6.18 =.*/LINUX_VERSION-6.18 = .38/g' include/kernel-version.mk
        
        # 3. 提供內核對應的 config (如果 25.12 官方未包含 6.18 配置文件)
        mkdir -p target/linux/qualcommax/config-6.18
        cp target/linux/qualcommax/config-6.6 target/linux/qualcommax/config-6.18/generic || true

    - name: 載入自定義 .config 配置文件
      run: |
        [ -e ${{ env.CONFIG_FILE }} ] && mv ${{ env.CONFIG_FILE }} openwrt/.config
        cd openwrt
        make defconfig

    - name: 下載依賴源碼包
      id: package
      run: |
        cd openwrt
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 編譯固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        # 初次編譯為避免崩潰，可使用多線程，出錯時改為單線程
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上傳編譯出的固件 Artifact
      uses: actions/upload-artifact@v4
      if: steps:compile.outputs.status == 'success'
      with:
        name: OpenWrt_IPQ60xx_AmneziaWG
        path: openwrt/bin/targets/qualcommax/

