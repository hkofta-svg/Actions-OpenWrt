name: Build AmneziaWG for OpenWrt ipq60xx

on:
  workflow_dispatch: # 支援手動點擊執行
  release:
    types: [published] # 當你在 GitHub 發布 Release 時自動觸發

jobs:
  build:
    name: Build Kernel Modules
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Initialization Environments
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget time

      - name: Download OpenWrt SDK
        run: |
          # 下載適用於 OpenWrt 25.12.1 ipq60xx 的官方 SDK
          wget https://openwrt.org
          tar -xJf openwrt-sdk-*.tar.xz
          mv openwrt-sdk-25.12.1-ipq60xx-generic_gcc-14.1.0_musl.Linux-x86_64 openwrt-sdk

      - name: Update & Install Feeds
        run: |
          cd openwrt-sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Clone AmneziaWG Source
        run: |
          cd openwrt-sdk
          # 複製官方非官方的 OpenWrt AmneziaWG 包原始碼
          git clone https://github.com package/amneziawg-openwrt

      - name: Compile Packages
        id: compile  # 定義正確的 ID 供後續步驟讀取
        run: |
          cd openwrt-sdk
          make defconfig
          
          # 將套件與內核驅動模組勾選為編譯為獨立包 (m)
          echo "CONFIG_PACKAGE_kmod-amneziawg=m" >> .config
          echo "CONFIG_PACKAGE_amneziawg-tools=m" >> .config
          echo "CONFIG_PACKAGE_luci-proto-amneziawg=m" >> .config
          
          # 開始編譯 AmneziaWG
          make package/amneziawg-openwrt/compile V=s -j$(nproc)
          
          # 尋找編譯完成的 .apk 包路徑並寫入環境變數
          # OpenWrt 25.12 已改用 .apk 副檔名
          APK_DIR="openwrt-sdk/bin/targets/ipq60xx/generic/packages"
          echo "pkg_dir=$APK_DIR" >> $GITHUB_OUTPUT

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-openwrt-25.12.1-ipq60xx
          # 使用正確的點號點導向語法讀取上一輪的輸出
          path: ${{ steps.compile.outputs.pkg_dir }}/*.apk

      - name: Upload APKs to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.compile.outputs.pkg_dir }}/*.apk
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
