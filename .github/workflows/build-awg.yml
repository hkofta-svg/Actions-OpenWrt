name: Build AmneziaWG for IPQ6010 (OpenWrt 25.12)

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Build AWG 3.1 for qualcommax/ipq60xx
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget jq zstd curl

      - name: Get OpenWrt SDK & Setup
        run: |
          # 1. Base download path for the stable 25.12.5 release
          BASE_URL="https://openwrt.org"
          
          echo "Scanning OpenWrt directory to locate the SDK filename..."
          
          # Dynamically extract the exact filename from the server's file listing page
          SDK_FILENAME=$(curl -sL "$BASE_URL" | grep -oE 'openwrt-sdk-[0-9a-zA-Z._-]+-qualcommax-ipq60xx_[a-zA-Z0-9._-]+\.tar\.zst' | head -n 1)
          
          # Fallback check: If the directory listing scan fails, use the expected standard production filename
          if [ -z "$SDK_FILENAME" ]; then
            echo "Warning: Live directory scan missed. Forcing fallback production filename mapping..."
            SDK_FILENAME="openwrt-sdk-25.12.5-qualcommax-ipq60xx_gcc-14.2.0_musl.Linux-x86_64.tar.zst"
          fi
          
          SDK_URL="${BASE_URL}${SDK_FILENAME}"
          echo "Target SDK Selected: $SDK_FILENAME"
          echo "Downloading from $SDK_URL..."
          
          # Fetch package from servers
          wget -q --show-progress -O sdk.tar.zst "$SDK_URL"
          
          # Verify that the server didn't redirect or return a corrupted file
          if ! file sdk.tar.zst | grep -q "Zstandard"; then
            echo "ERROR: Download file format is incorrect. Server failed to provide a valid compressed Zstd archive."
            exit 1
          fi
          
          # Unpack the archive into the root execution workspace
          tar -I zstd -xf sdk.tar.zst --strip-components=1
          rm sdk.tar.zst
          
          # 2. Update and build target definitions
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add AmneziaWG Source Feed
        run: |
          # Add the AmneziaWG OpenWrt package source feed (v3.1 branch)
          echo "src-git amneziawg https://github.com" >> feeds.conf.default
          ./scripts/feeds update amneziawg
          ./scripts/feeds install -a -p amneziawg

      - name: Mock & Lock Kernel Version (6.18.38)
        run: |
          # Force the SDK kernel configuration to match your exact kernel target (6.18.38)
          if [ -f include/kernel-6.18 ]; then
            sed -i 's/LINUX_VERSION:=.*/LINUX_VERSION:=6.18.38/g' include/kernel-6.18
          else
            sed -i 's/LINUX_VERSION:=.*/LINUX_VERSION:=6.18.38/g' include/kernel-*
          fi

      - name: Configure Packages
        run: |
          # Generate base configurations
          make defconfig
          
          # Force standalone module targets for AmneziaWG packages
          echo "CONFIG_PACKAGE_kmod-amneziawg=m" >> .config
          echo "CONFIG_PACKAGE_amneziawg-tools=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-amneziawg=m" >> .config
          
          # Refresh tool configuration matrix
          make defconfig

      - name: Compile AmneziaWG
        run: |
          # Build target packages with verbose stdout stream
          make package/amneziawg-openwrt/compile V=s -j$(nproc)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-ipq6010-apk-packages
          # Save compiled components (.apk binary objects)
          path: bin/packages/*/amneziawg/
