name: Build AmneziaWG for OpenWrt 25.12

on:
  workflow_dispatch: # 支援手動觸發編譯

jobs:
  build:
    name: Build AWG 3.1 Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget jq

      - name: Get OpenWrt SDK & Setup
        run: |
          # 1. 下載對應架構的 OpenWrt 25.12 SDK (此處以 x86_64 為例，請根據你的硬體調整 targets 網址)
          # 注意：將 target 修改成你的路由器晶片，如: mediatek/filogic 或 rockchip/armv8
          SDK_URL="https://openwrt.org"
          
          wget -qO- "$SDK_URL" | tar -xJ --strip-components=1
          
          # 2. 更新與安裝基礎 Feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add AmneziaWG Source Feed
        run: |
          # 引入社群維護的 AmneziaWG OpenWrt 套件源
          echo "src-git amneziawg https://github.com" >> feeds.conf.default
          ./scripts/feeds update amneziawg
          ./scripts/feeds install -a -p amneziawg

      - name: Mock & Lock Kernel Version (Vermagic Fix)
        run: |
          # 為了強制讓編譯出來的 kmod 吻合核心 6.18.38，直接修改 SDK 的核心設定
          # 修改內核大版本為 6.18，並指定具體修訂號 38
          sed -i 's/LINUX_VERSION:=.*/LINUX_VERSION:=6.18.38/g' include/kernel-6.18
          
          # 獲取你目前軟路由/編譯系統上的正確 vermagic（可從現有包名或固件 opkg/apk info kernel 取得）
          # 強制寫入對應的 vermagic 雜湊值防止出錯
          # echo "CONFIG_KERNEL_MAGICVER=你的vermagic雜湊" >> .config

      - name: Configure Packages
        run: |
          # 生成預設設定檔
          make defconfig
          
          # 啟用 AmneziaWG 及其相關元件進行編譯
          echo "CONFIG_PACKAGE_kmod-amneziawg=m" >> .config
          echo "CONFIG_PACKAGE_amneziawg-tools=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-amneziawg=m" >> .config
          
          # 再次檢查與修正設定檔
          make defconfig

      - name: Compile AmneziaWG
        run: |
          # 開始編譯 package，V=s 輸出詳細日誌方便排錯
          make package/amneziawg-openwrt/compile V=s -j$(nproc)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-openwrt-25.12-packages
          path: bin/packages/*/amneziawg/
